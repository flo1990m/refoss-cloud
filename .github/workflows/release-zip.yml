name: Attach release ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to process (for example v1.0.9)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  zip:
    name: Build and upload Refoss ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

      - name: Create refoss-cloud.zip
        shell: bash
        run: |
          cd custom_components/refoss_cloud
          zip -r ../../refoss-cloud.zip . -x "*.pyc" "__pycache__/*"
          cd ../..
          test -s refoss-cloud.zip
          unzip -l refoss-cloud.zip

      - name: Upload ZIP to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: gh release upload "$TAG" refoss-cloud.zip --clobber
