name: Attach release ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to process (for example v1.0.9)"
        required: false
        type: string
  # One-time bootstrap: this follow-up workflow commit builds the ZIP for
  # the already-published v1.0.9 release. Future code pushes do not trigger it.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-zip.yml"

permissions:
  contents: write

jobs:
  zip:
    name: Build and upload Refoss ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Select release tag
        id: target
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ -n "$RELEASE_TAG" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.9" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Create refoss-cloud.zip
        shell: bash
        run: |
          cd custom_components/refoss_cloud
          zip -r ../../refoss-cloud.zip . -x "*.pyc" "__pycache__/*"
          cd ../..
          test -s refoss-cloud.zip
          unzip -l refoss-cloud.zip

      - name: Upload ZIP to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: gh release upload "$TAG" refoss-cloud.zip --clobber
