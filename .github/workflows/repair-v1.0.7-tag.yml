name: Repair v1.0.7 release tag

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type MOVE-v1.0.7-TO-MAIN to move the v1.0.7 tag to the current main commit"
        required: true
        type: string

permissions:
  contents: write

jobs:
  repair-tag:
    name: Move v1.0.7 tag to main
    runs-on: ubuntu-latest
    steps:
      - name: Verify and move release tag
        uses: actions/github-script@v7
        with:
          script: |
            const expected = "MOVE-v1.0.7-TO-MAIN";
            const supplied = "${{ inputs.confirm }}";

            if (supplied !== expected) {
              core.setFailed("Confirmation does not match. No tag was changed.");
              return;
            }

            const { owner, repo } = context.repo;

            // Make sure the published release exists before changing its tag.
            await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: "v1.0.7",
            });

            // Read the exact current main commit and the current release tag.
            const { data: main } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: "main",
            });
            const targetSha = main.commit.sha;

            const { data: currentTag } = await github.rest.git.getRef({
              owner,
              repo,
              ref: "tags/v1.0.7",
            });

            core.info("Current v1.0.7 tag: " + currentTag.object.sha);
            core.info("Current main commit: " + targetSha);

            if (currentTag.object.sha !== targetSha) {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: "tags/v1.0.7",
                sha: targetSha,
                force: true,
              });
            }

            const { data: verifiedTag } = await github.rest.git.getRef({
              owner,
              repo,
              ref: "tags/v1.0.7",
            });

            if (verifiedTag.object.sha !== targetSha) {
              core.setFailed("Tag verification failed: v1.0.7 does not point to main.");
              return;
            }

            await core.summary
              .addHeading("Refoss Cloud v1.0.7 tag repaired")
              .addRaw("The v1.0.7 release tag now points to the current main commit: ")
              .addCodeBlock(targetSha)
              .addRaw("\nThe release notes and release URL were preserved.")
              .write();

            core.info("Verified: v1.0.7 now points to main.");
